<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#e8951a"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="#333" stroke-width="4"/>

  <!-- Film reel outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#accent)" stroke-width="16"/>

  <!-- Sprocket holes (outer ring) -->
  <g fill="#1a1a1a">
    <!-- Top -->
    <rect x="248" y="32" width="16" height="20" rx="3"/>
    <rect x="198" y="34" width="16" height="18" rx="3" transform="rotate(15,206,43)"/>
    <rect x="300" y="34" width="16" height="18" rx="3" transform="rotate(-15,308,43)"/>
    <!-- Right -->
    <rect x="464" y="248" width="20" height="16" rx="3"/>
    <rect x="462" y="198" width="18" height="16" rx="3" transform="rotate(15,471,206)"/>
    <rect x="462" y="300" width="18" height="16" rx="3" transform="rotate(-15,471,308)"/>
    <!-- Bottom -->
    <rect x="248" y="464" width="16" height="20" rx="3"/>
    <rect x="198" y="462" width="16" height="18" rx="3" transform="rotate(-15,206,471)"/>
    <rect x="300" y="462" width="16" height="18" rx="3" transform="rotate(15,308,471)"/>
    <!-- Left -->
    <rect x="32" y="248" width="20" height="16" rx="3"/>
    <rect x="34" y="198" width="18" height="16" rx="3" transform="rotate(-15,43,206)"/>
    <rect x="34" y="300" width="18" height="16" rx="3" transform="rotate(15,43,308)"/>
    <!-- Diagonals -->
    <rect x="98" y="98" width="16" height="16" rx="3" transform="rotate(45,106,106)"/>
    <rect x="398" y="98" width="16" height="16" rx="3" transform="rotate(-45,406,106)"/>
    <rect x="98" y="398" width="16" height="16" rx="3" transform="rotate(-45,106,406)"/>
    <rect x="398" y="398" width="16" height="16" rx="3" transform="rotate(45,406,406)"/>
  </g>

  <!-- Inner reel circle -->
  <circle cx="256" cy="256" r="170" fill="url(#inner)" stroke="url(#accent)" stroke-width="4"/>

  <!-- Inner sprocket ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="8,12"/>

  <!-- Center design: stylized "H" with film strip integration -->
  <g transform="translate(256,256)">
    <!-- Film strip frame left -->
    <rect x="-105" y="-75" width="20" height="150" rx="6" fill="url(#accent)" opacity="0.9"/>
    <!-- Perforations on left strip -->
    <rect x="-99" y="-60" width="8" height="8" rx="2" fill="#1a1a1a"/>
    <rect x="-99" y="-30" width="8" height="8" rx="2" fill="#1a1a1a"/>
    <rect x="-99" y="0" width="8" height="8" rx="2" fill="#1a1a1a"/>
    <rect x="-99" y="30" width="8" height="8" rx="2" fill="#1a1a1a"/>
    <rect x="-99" y="52" width="8" height="8" rx="2" fill="#1a1a1a"/>

    <!-- Film strip frame right -->
    <rect x="85" y="-75" width="20" height="150" rx="6" fill="url(#accent)" opacity="0.9"/>
    <!-- Perforations on right strip -->
    <rect x="91" y="-60" width="8" height="8" rx="2" fill="#1a1a1a"/>
    <rect x="91" y="-30" width="8" height="8" rx="2" fill="#1a1a1a"/>
    <rect x="91" y="0" width="8" height="8" rx="2" fill="#1a1a1a"/>
    <rect x="91" y="30" width="8" height="8" rx="2" fill="#1a1a1a"/>
    <rect x="91" y="52" width="8" height="8" rx="2" fill="#1a1a1a"/>

    <!-- H crossbar -->
    <rect x="-85" y="-12" width="170" height="24" rx="8" fill="url(#accent)"/>

    <!-- 3D text inside the H -->
    <text x="0" y="68" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="52" fill="url(#accent)" letter-spacing="2">3D</text>
  </g>

  <!-- Subtle glow -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#f5a623" stroke-width="1" opacity="0.15"/>
</svg>